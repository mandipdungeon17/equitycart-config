# Shared across all services
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    config:
      server:
        health:
          enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.equitycart: INFO

#  Root Cause: Hyper-V Virtual Network Adapter
#  IE4LLT9F6RS54.mshome.net is your machine's hostname as seen by the Hyper-V virtual NAT adapter — created by Docker Desktop or WSL2.
#  When Eureka calls InetAddress.getLocalHost().getHostName() to determine what hostname to register with, Java returns this Hyper-V interface's hostname instead of localhost.
#  The gateway then tries to route to IE4LLT9F6RS54.mshome.net:8081 — a hostname that doesn't resolve via DNS — and fails with UnknownHostException.
#  This is extremely common on Windows machines with Docker Desktop or WSL2 installed.
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
#    ip-address: 127.0.0.1

  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always