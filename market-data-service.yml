server:
  port: 8085

equitycart:
  security:
    mode: custom

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/equitycart_marketdata}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

alphaVantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:GABC5OWOK7YA1TG9}
  base-url: https://www.alphavantage.co

resilience4j:
  retry:
    instances:
      alphaVantage:
        max-attempts: 3
        wait-duration: 2s
  circuitbreaker:
    instances:
      alphaVantage:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
  rate-limiter:
    instances:
      alphaVantage:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s
