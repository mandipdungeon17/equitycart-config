server:
  port: 8084

equitycart:
  security:
    mode: custom

  sell-to-spend:
    strategy: saga    # "transactional" (default) or "saga"
  saga:
    timeout-seconds: 30

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equitycart_portfolio}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/equitycart_portfolio}

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

  kafka:
    # Examples of multiple broker : bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    consumer:
      group-id: equitycart-portfolio-group
      auto-offset-reset: earliest # Start from the beginning if no committed offset exists (don't miss events)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.equitycart.commons.event

alphaVantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:GABC5OWOK7YA1TG9}
  base-url: https://www.alphavantage.co
