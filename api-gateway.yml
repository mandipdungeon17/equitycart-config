server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/api/portfolio/**
        - id: market-data-service
          uri: lb://market-data-service
          predicates:
            - Path=/api/market-data/**
        - id: ledger-service
          uri: lb://ledger-service
          predicates:
            - Path=/api/ledger/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**